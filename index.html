<!DOCTYPE html>
<html lang="mr">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2620880768614453"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>माझी Farming App</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f8e9;
  color: #1b5e20;
}

header {
  background: #2e7d32;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 3px 10px #bbb;
}

.card h2 {
  margin-top: 0;
}

button {
  background: #388e3c;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  margin-top: 10px;
}

button:active {
  background: #1b5e20;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #aaa;
  border-radius: 8px;
  font-size: 16px;
}

#result {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>🌾 माझी Farming App</h1>
  <p>शेतकऱ्यांसाठी उपयुक्त माहिती</p>
</header>

<div class="container">

  <div class="card">
    <h2>🌱 पीक निवडा</h2>
    <!-- रोग ओळखा सेक्शन -->
<div style="background:#fff; padding:15px; margin:15px; border-radius:10px; box-shadow:0 2px 5px #ccc;">
  <h2>📸 रोग ओळखा</h2>
  <p>पिकाच्या पानाचा फोटो काढा आणि तपासा</p>

  <input type="file" id="photoInput" accept="image/*" capture="camera" style="margin:10px 0;">
  <br>
  <button onclick="checkDisease()" style="background:green; color:white; padding:10px 20px; border:none; border-radius:5px;">
    रोग तपासा
  </button>

  <div id="result" style="margin-top:15px; font-weight:bold;"></div>
</div>

<script>
function checkDisease() {
  const file = document.getElementById('photoInput').files[0];
  if(!file){
    document.getElementById('result').innerText = "कृपया आधी फोटो निवडा";
    return;
  }
  document.getElementById('result').innerText = "फोटो अपलोड झाला. आता मी AI ला पाठवून रोग सांगतो...";

  // इथे नंतर AI जोडू. आत्तासाठी फोटो मला WhatsApp करा म्हणेल
}
</script>
    <input type="text" id="crop" placeholder="उदा. सोयाबीन, कांदा, गहू">
    <button onclick="showCrop()">माहिती पहा</button>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2>💰 शेती खर्च कॅल्क्युलेटर</h2>

    <input type="number" id="seed" placeholder="बियाणे खर्च ₹">
    <input type="number" id="fertilizer" placeholder="खत खर्च ₹">
    <input type="number" id="labour" placeholder="मजुरी खर्च ₹">

    <button onclick="calculate()">एकूण खर्च काढा</button>

    <div id="total"></div>
  </div>

  <div class="card">
    <h2>📢 शेतकरी टिप</h2>
    <p>पिकांना योग्य वेळी पाणी द्या आणि हवामानाचा अंदाज पाहून शेतीची कामे करा.</p>
  </div>

</div>

<script>

function showCrop() {

  let crop = document.getElementById("crop").value;
  let result = document.getElementById("result");

  if (crop == "") {
    result.innerHTML = "कृपया पिकाचे नाव लिहा.";
  } else {
    result.innerHTML =
    "🌱 " + crop + " साठी योग्य माहिती लवकरच उपलब्ध होईल.";
  }

}

function calculate() {

  let seed = Number(document.getElementById("seed").value) || 0;
  let fertilizer = Number(document.getElementById("fertilizer").value) || 0;
  let labour = Number(document.getElementById("labour").value) || 0;

  let total = seed + fertilizer + labour;

  document.getElementById("total").innerHTML =
  "💰 एकूण शेती खर्च: ₹" + total;

}

</script>

</body>
</html>
